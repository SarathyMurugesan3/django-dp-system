name: Keep Render Server Alive

on:
  schedule:
    - cron: '*/5 * * * *' # Runs every 5 minutes (GitHub Actions minimum interval)
  workflow_dispatch: # Allows manual run in the GitHub Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Web Service
        run: |
          curl -I -s https://django-dp-system.onrender.com/
          echo "Ping executed successfully at $(date)"
