services:
  - type: web
    name: django-dp-system
    env: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn -c gunicorn_config.py proj.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.6
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: false
      - key: ALLOWED_HOSTS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: django-dp-db
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        sync: false

databases:
  - name: django-dp-db
    databaseName: django_dp_system
    user: django_dp_user
